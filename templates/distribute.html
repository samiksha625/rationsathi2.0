{% extends "base.html" %}{% block title %}Distribution · RationSathi{% endblock %}
{% block content %}<h1>Record ration distribution</h1><section class="panel" style="max-width:650px"><p class="muted">Records the distribution and deducts the quantity from available stock.</p><form method="post"><label>Beneficiary</label><select name="card_number" required><option value="">Choose beneficiary</option>{% for b in beneficiaries %}<option value="{{ b.card_number }}">{{ b.card_number }} — {{ b.name }}</option>{% endfor %}</select><label>Commodity</label><select name="commodity" required><option value="">Choose commodity</option>{% for s in stock %}<option value="{{ s.commodity }}">{{ s.commodity }} ({{ '%.2f'|format(s.quantity_kg) }} kg available)</option>{% endfor %}</select><label>Quantity (kg)</label><input name="quantity_kg" type="number" min="0.01" step="0.01" required><button>Record distribution</button></form></section>{% endblock %}
