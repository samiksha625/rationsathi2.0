{% extends "base.html" %}{% block title %}Stock · RationSathi{% endblock %}
{% block content %}<h1>Stock management</h1><div class="layout"><section class="panel"><h2>Add or update stock</h2><form method="post"><label>Commodity</label><input name="commodity" required placeholder="e.g. Rice"><label>Available quantity (kg)</label><input name="quantity" type="number" min="0" step="0.01" required><button>Save stock</button></form></section><section class="panel"><h2>Current inventory</h2><div class="table-wrap"><table><tr><th>Commodity</th><th>Quantity (kg)</th></tr>{% for row in rows %}<tr><td>{{ row.commodity }}</td><td>{{ '%.2f'|format(row.quantity_kg) }}</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
